    config: configs/assignments/experiments/llama_31_8b_instruct/instance/os_interaction/instance/previous_sample_utilization_usc1.yaml
    args: []

  llama-os-longllmlingua-k1:
    description: Llama 3.1 8B, OS Interaction, LongLLMLingua replay (k=1)
    config: configs/assignments/experiments/llama_31_8b_instruct/instance/os_interaction/instance/longllmlingua_usc1.yaml
    args: []

  llama-os-gsc-k1:
    description: Llama 3.1 8B, OS Interaction, LAB group self-consistency (usc=1)
    config: configs/assignments/experiments/llama_31_8b_instruct/instance/os_interaction/instance/group_self_consistency_gc1_scpg1.yaml
    args: []

  gpt-db-no-replay:
