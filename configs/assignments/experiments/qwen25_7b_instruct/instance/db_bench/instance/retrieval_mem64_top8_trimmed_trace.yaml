import:
- ../task.yaml
- ../../../agent.yaml
- ../../../../../../definition.yaml

# Deterministic trimmed-trace replay for retrieval-gated top-8.
# Keeps the original question and exact Action/Answer protocol while trimming
# bulky SQL result dumps to a short row-limited preview.
assignment_config:
  callback_dict:
    callback_0:
      name: current_session_saving_callback
    callback_1:
      name: consecutive_abnormal_agent_inference_process_handling_callback
    callback_2:
      name: retrieval_previous_sample_utilization_callback
      custom_parameters:
        utilized_sample_count: 64
        retrieved_sample_count: 8
        full_replay_sample_count: 8
        lexical_weight: 0.35
        skill_weight: 0.50
        table_weight: 0.15
        enable_success_cards: false
        replay_render_mode: trimmed_trace
        trimmed_result_row_limit: 5
        trimmed_result_char_limit: 240
  output_dir: outputs/{TIMESTAMP}
  sample_order: default

environment_config:
  use_task_client_flag: false

task_dict:
  db_bench:
    parameters:
      chat_history_item_factory:
        parameters:
          chat_history_item_dict_path: ./chat_history_items/previous_sample_utilization/db_bench.json
