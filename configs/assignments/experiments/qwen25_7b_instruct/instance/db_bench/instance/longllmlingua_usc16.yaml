import:
- ../task.yaml
- ../../../agent.yaml
- ../../../../../../definition.yaml

# LongLLMLingua replay-compression baseline.
# This keeps the replay callback structure but makes the compression
# question-aware and trajectory-aware:
# - separate trajectories are passed as separate context blocks
# - the current DBBench instruction is used as the "question"
# - local task mode is used so the replay template override is respected
# - compression is conservative because replay traces are brittle demos
assignment_config:
  callback_dict:
    callback_0:
      name: current_session_saving_callback
    callback_1:
      name: consecutive_abnormal_agent_inference_process_handling_callback
    callback_2:
      name: llmlingua_previous_sample_utilization_callback
      custom_parameters:
        utilized_sample_count: 16
        compression_rate: 0.8
        target_token: -1
        compressor_model_name: "Qwen/Qwen2.5-3B-Instruct"
        use_llmlingua2: false
        device: "cuda"
  output_dir: outputs/{TIMESTAMP}
  sample_order: default

environment_config:
  use_task_client_flag: false

task_dict:
  db_bench:
    parameters:
      chat_history_item_factory:
        parameters:
          chat_history_item_dict_path: ./chat_history_items/previous_sample_utilization/db_bench.json
